services:
  - type: web
    name: soundloom
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: soundloom-data
      mountPath: /data
      sizeGB: 25
    envVars:
      - key: DATA_DIR
        value: /data
      - key: MAX_TOTAL_STORAGE_BYTES
        value: "21474836480"
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
